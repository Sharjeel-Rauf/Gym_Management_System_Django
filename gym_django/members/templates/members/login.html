{% extends 'base.html' %}
{% load static %}
{% block content %}



<!-- Message box if wrong credentials -->
<div class="container">
    {% if messages %}
        {% for message in messages %}
            <div class="message-box">{{ message }}</div>
        {% endfor %}
    {% endif %}
</div>

<div class="main-login">
    <div class="left-login">
        <h1>Login<br>and join our team</h1>
        <img src="{% static 'gym_management_system/images/witch-animate.svg' %}" class="left-login-image" alt="animated-image">
    </div>

    <div class="right-login">
        <div class="card-login">
            <h1>LOGIN</h1>
            <form action="" method="POST">
                {% csrf_token %}
                <div class="textfield">
                    <label for="exampleInputEmail1">Username</label>
                    <input type="text" name="username" placeholder="username" aria-describedby="emailHelp">
                </div>
                <div class="textfield">
                    <label for="exampleInputPassword1">Password</label>
                    <input type="password" name="password" placeholder="password">
                </div>
                <button class="btn-login">Login</button>
                <div class="btn-plus">
                    <p>Don't have an account? <a href="{% url 'register_user' %}" class="btn-cadastre-se"> <span class="span-cadastre-se">Register</span></a></p>
                </div>
            </form>
        </div>
    </div>
</div>







{% endblock %}

<!-- register_user.html -->
{% extends 'base.html' %}
{% load static %}
{% block content %}

<header>
    <!-- parent -->
    <nav class="nav">
        <!-- child 1 -->
        <div class="nav-list-1">
            <i class="fa-solid fa-dumbbell"></i>
            <a id="goBackLink" href="{% url 'home' %}"><h1>Django Gym</h1></a>
        </div>
    </nav>
</header>

<body class="body-create-form">
    <div class="form-container">
        <h2 class="form-title">Register</h2>

        <!-- Message box if wrong credentials -->
        <div class="container">
            {% if form.errors %}
                <div class="message-box">There was an error with the forms</div>
            {% endif %}
        </div>

        <!-- Registration form -->
        <form action="{% url 'register_user' %}" method="POST" class="custom-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="{{ form.username.id_for_label }}">Username:</label>
                {{ form.username }}
            </div>
            <div class="form-group">
                <label for="{{ form.password1.id_for_label }}">Password:</label>
                {{ form.password1 }}
            </div>
            <div class="form-group">
                <label for="{{ form.password2.id_for_label }}">Confirm Password:</label>
                {{ form.password2 }}
            </div>
            <div class="form-submit">
                <input type="submit" value="Submit">
            </div>
        </form>
    </div>
</body>

{% endblock %}
